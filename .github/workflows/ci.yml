# CI (TECHDEBT 14.9): pytest + ruff + pip-audit + bandit на каждый push/PR.
#
# Тесты идут без Postgres/Redis: скипы (нет test-Postgres) прогоняются
# на среде разработчика с поднятым test-Postgres.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
          pip install ruff
      - name: Ruff (lint)
        run: ruff check app tests
      - name: Pytest
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests -q -p no:cacheprovider

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit bandit
      - name: pip-audit (known CVEs in deps)
        run: pip-audit --skip-editable
      - name: Bandit (SAST, medium+)
        run: bandit -r app -ll --skip B101
