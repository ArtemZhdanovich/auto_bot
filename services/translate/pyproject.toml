[project]
name = "translate-service"
version = "0.1.0"
description = "NLLB title translation microservice (PLAN.md, phase 5; optional service)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "torch>=2.2",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
]

[project.scripts]
translate-api = "translate_api.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translate_api"]