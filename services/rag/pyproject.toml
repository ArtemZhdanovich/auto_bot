[project]
name = "rag-service"
version = "0.1.0"
license = { text = "MIT" }
description = "RAG-микросервис auto_bot (ядро из rag_service): worker + HTTP API"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.3.1",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.7.0",
    "dishka>=1.2.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=2.7.0",
    # Прямая зависимость + tool.uv.sources ниже: без этого torch остаётся
    # транзитивным (sources действуют только на прямые deps) и тянется с PyPI
    # вместе с ~3-5 ГБ nvidia-*-колёс.
    "torch>=2.2",
    "unstructured[md]>=0.15.0",
    "markdown>=3.5.2",
    "python-magic>=0.4.27",
    "minio>=7.2.7",
    "cryptography>=45",
    "pyjwt[crypto]>=2.8.1",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.1",
    "beautifulsoup4>=4.12.0",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
    "alembic>=1.19.2",
    "orjson>=3.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# torch только CPU: инференс e5-small укладывается в CPU, а CUDA-сборка тянет
# ~3-5 ГБ nvidia-* колёс (медленный билд + лишний RSS в контейнере).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["rag_core", "rag_worker", "rag_api"]

[project.scripts]
rag-worker = "rag_worker.main:main_entry"
rag-api = "rag_api.main:main_entry"
