[project]
name = "bot-encar"
version = "0.1.0"
description = "Экосистема подбора автомобилей: Telegram-бот, Mini App, backend, адаптеры источников"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.1",
    "aiogram>=3.13",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "selectolax>=0.3",
    "aio-pika>=10.1.1",
    "cryptography>=45",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


