# Dev/staging окружение (ТЗ п. 11.2).
#
# Два режима развёртывания (docker compose profiles):
#   --profile mono   — монолит: backend со всеми роутерами на :8000;
#   --profile micro  — микросервисы: gateway (:8010, хост) + 6 доменных
#                      сервисов (:8101–8106); gateway получает сетевой
#                      алиас `backend`, поэтому бот и Mini App не меняются.
# Инфраструктура (postgres/redis/rabbitmq/qdrant/minio/rag/translate)
# общая для обоих режимов. Бот, воркеры и Mini App стартуют в любом
# из профилей: --profile mono или --profile micro.
# Примеры:
#   docker compose --profile mono up -d
#   docker compose --profile micro up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autoselect
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ---------- Centrifugo (чаты/внутренний рынок, редизайн часть 5) ----------
  # Websocket-сервер v6: браузерные JWT (HS256) + серверная публикация.
  # Конфиг configs/centrifugo.json — иерархический формат v6; секреты в нём —
  # placeholders, реальные значения приходят env-переменными (v6 перекрывают
  # файл): соответствуют CENTRIFUGO_SECRET/CENTRIFUGO_HTTP_API_KEY из .env.
  # Subscribe-proxy ходит в backend (алиас gateway в профиле micro) со
  # статическим X-Internal-Token из configs/centrifugo.json — это же значение
  # бэкенд принимает как centrifugo_http_api_key.
  centrifugo:
    image: centrifugo/centrifugo:v6
    # Конфиг с подстановкой env при старте (JSON не умеет env): секреты
    # из .env, endpoint subscribe-proxy — на gateway.
    command:
      - sh
      - -c
      - sed 's|__SECRET__|'"$${CENTRIFUGO_SECRET}"'|;s|__API_KEY__|'"$${CENTRIFUGO_HTTP_API_KEY}"'|;s|__INTERNAL__|'"$${INTERNAL_TOKEN}"'|;s|__PROXY__|http://gateway:8000|' /centrifugo/config.tmpl > /tmp/config.json && exec centrifugo -c /tmp/config.json
    env_file: .env
    volumes:
      - ./configs/centrifugo.json.tmpl:/centrifugo/config.tmpl:ro
    ports:
      - "8008:8000"
    healthcheck:
      # Centrifugo OSS 6.10 не отдаёт GET /health; wget busybox не умеет
      # POST/headers. Тест: любой ответ HTTP (даже 404) = сервер жив.
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://localhost:8000/api 2>/dev/null; [ $? -ne 4 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["realtime"]

  rabbitmq:
    profiles: ["workers", "mono", "micro"]
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    profiles: ["core", "mono"]
    environment:
      # .env может держать localhost (запуск по процессам) — в compose хост другой
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # RAG — по имени сервиса (localhost в .env — для запуска по процессам)
      RAG_SERVICE_URL: http://rag_api:8100
      # glm отвечает ~60-90 сек: дефолтные 5 сек бот не дожидается
      RAG_TIMEOUT_SEC: "120"
      # Публикация в каналы чатов (редизайн часть 5); .env может держать localhost
      CENTRIFUGO_URL: http://centrifugo:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s

  bot:
    build: .
    command: python -m app.transport.bot
    env_file: .env
    profiles: ["core", "mono", "micro"]
    environment:
      # Внутри compose бот ходит в backend по имени сервиса
      # (в профиле micro это alias gateway'а)
      APP_BASE_URL: http://backend:8000
      # FSM-хранилище бота — Redis; .env может держать localhost (запуск по процессам)
      REDIS_URL: redis://redis:6379/0
    # Long-polling без HTTP-порта: liveness по heartbeat-файлу
    healthcheck:
      test: ["CMD", "python", "-m", "app.infrastructure.runtime.heartbeat", "bot"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      backend: { condition: service_healthy, required: false }   # профиль mono
      gateway: { condition: service_healthy, required: false }   # профиль micro (alias backend)
      rabbitmq: { condition: service_healthy, required: false }

  worker_fetch:
    build: .
    command: python -m app.infrastructure.workers.fetch
    env_file: .env
    profiles: ["workers", "mono", "micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    healthcheck:
      test: ["CMD", "python", "-m", "app.infrastructure.runtime.heartbeat", "fetch"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }

  worker_send:
    build: .
    command: python -m app.infrastructure.workers.send
    env_file: .env
    profiles: ["workers", "mono", "micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    healthcheck:
      test: ["CMD", "python", "-m", "app.infrastructure.runtime.heartbeat", "send"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }

  miniapp:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["core", "mono", "micro"]
    ports:
      - "8080:80"
      - "8443:443"          # HTTPS (self-signed) — для web_app-кнопки и браузера
    environment:
      NG_HOST_IP: ${LAN_IP:-127.0.0.1}   # LAN-IP хоста → SAN сертификата
    healthcheck:
      # nginx:alpine — busybox wget; 127.0.0.1 явно: localhost резолвится в ::1,
      # а nginx слушает только IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend: { condition: service_healthy, required: false }   # профиль mono
      gateway: { condition: service_healthy, required: false }   # профиль micro (alias backend)

  # ---------- Микросервисы (профиль micro; docker compose --profile micro up) ----------

  # Единая точка входа /api/*; алиас backend — бот и nginx Mini App
  # ходят в него без изменения конфигурации.
  gateway:
    build: .
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    profiles: ["micro"]
    environment:
      # Для миграций (start.bat micro гонит alembic отсюда) и общего кода;
      # в .env DATABASE_URL указывает на localhost — внутри сети хост postgres.
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      SVC_IDENTITY_URL: http://identity:8101
      SVC_CATALOG_URL: http://catalog:8102
      SVC_BILLING_URL: http://billing:8103
      SVC_PARTNERS_URL: http://partners:8104
      SVC_DIALOG_URL: http://dialog:8105
      SVC_ADMIN_URL: http://admin:8106
      SVC_CHAT_URL: http://chat:8107
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }
    ports:
      # Один и тот же хост-порт, что и у mono-backend: профили взаимно
      # исключающи (общий алиас backend), попытка поднять оба = громкая
      # ошибка бинда порта вместо тихих 502 от DNS round-robin.
      - "8000:8000"
    networks:
      default:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s

  identity:
    build: .
    command: uvicorn services.identity.main:app --host 0.0.0.0 --port 8101
    env_file: .env
    profiles: ["micro"]
    environment:
      # .env может держать localhost (запуск по процессам) — в compose хост другой
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s

  catalog:
    build: .
    command: uvicorn services.catalog.main:app --host 0.0.0.0 --port 8102
    env_file: .env
    profiles: ["micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s

  billing:
    build: .
    command: uvicorn services.billing.main:app --host 0.0.0.0 --port 8103
    env_file: .env
    profiles: ["micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s

  partners:
    build: .
    command: uvicorn services.partners.main:app --host 0.0.0.0 --port 8104
    env_file: .env
    profiles: ["micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8104:8104"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s

  dialog:
    build: .
    command: uvicorn services.dialog.main:app --host 0.0.0.0 --port 8105
    env_file: .env
    profiles: ["ai", "micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }   # финализация ставит fetch-задачи
    ports:
      - "8105:8105"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105/health"]
      interval: 30s

  admin:
    build: .
    command: uvicorn services.admin.main:app --host 0.0.0.0 --port 8106
    env_file: .env
    profiles: ["micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }   # ручной fetch ставит задачу
    ports:
      - "8106:8106"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8106/health"]
      interval: 30s

  chat:
    build: .
    command: uvicorn services.chat.main:app --host 0.0.0.0 --port 8107
    env_file: .env
    profiles: ["realtime", "micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      # Публикация в каналы чатов — по имени сервиса centrifugo (внутри
      # сети compose centrifugo слушает :8000, 8008 — только публикация)
      CENTRIFUGO_URL: http://centrifugo:8000
      # RAG-бот поддержки — по имени сервиса (localhost в .env — для локали)
      RAG_SERVICE_URL: http://rag_api:8100
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8107:8107"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8107/health"]
      interval: 30s


  # ---------- RAG-микросервис (ядро из rag_service) ----------
  qdrant:
    profiles: ["ai", "micro"]
    image: qdrant/qdrant:latest
    # Постоянный скрининг объяв растит коллекции — лимит не даёт qdrant'у
    # выесть память у postgres/backend на общем узле.
    mem_limit: 2g
    memswap_limit: 2g
    # wget/curl в образе нет — TCP-проба /readyz порта через bash
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  minio:
    # minio/minio удалён из Docker Hub (2025), quay-зеркало закрыто (401) —
    # рабочий образ bitnamilegacy (uid 1001); заменяется через MINIO_IMAGE в .env.
    # Если named-volume minio_data создан другим образом (root), сделать разово:
    #   docker run --rm -v auto_bot_minio_data:/data alpine chown -R 1001:1001 /data
    profiles: ["storage", "mono", "micro"]
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    command: server /data --console-address ":9001"
    healthcheck:
      # TCP-проба API-порта (mc в legacy-образе не гарантирован)
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # One-shot: БД rag в общем postgres + миграции alembic
  rag_migrate:
    profiles: ["ai", "micro"]
    image: postgres:16
    environment:
      PGPASSWORD: ${DB_PASSWORD:-app}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -U app -d autoselect -tc "SELECT 1 FROM pg_database WHERE datname='rag'" | grep -q 1 ||           psql -h postgres -U app -d autoselect -c 'CREATE DATABASE rag'
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  rag_migrate_alembic:
    profiles: ["ai", "micro"]
    build: ./services/rag
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/rag
    depends_on:
      rag_migrate: { condition: service_completed_successfully }
    restart: "no"

  rag_worker:
    profiles: ["ai", "micro"]
    build: ./services/rag
    command: ["rag-worker"]
    environment: &rag_env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QDRANT_HOST: qdrant
      POSTGRES_DSN: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/rag
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: ${RAG_JWT_SECRET:-${APP_SECRET_KEY}}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-glm}
      LLM_MODEL: ${RAG_LLM_MODEL:-glm-4.6}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://api.z.ai/api/paas/v4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ENCRYPT_DOCUMENTS: ${ENCRYPT_DOCUMENTS:-false}
      PQ_ENCRYPTION_PUBLIC_KEY: ${PQ_ENCRYPTION_PUBLIC_KEY:-}
      PQ_ENCRYPTION_PRIVATE_KEY: ${PQ_ENCRYPTION_PRIVATE_KEY:-}
      REDIS_URL: redis://redis:6379/1
      METRICS_PORT: "8101"
      WORKER_QUEUES: "all"
      # Кэш embedding-модели — как у translate: без volume модель
      # скачивается с HF при каждом рестарте; xet отключаем (флейт у anon-доступа)
      HF_HOME: /srv/.hf
      HF_HUB_DISABLE_XET: "1"
    # Воркер держит embedding-модель (e5-small) + шифрованные чанки в памяти —
    # фиксированный потолок вместо «сколько дадут».
    mem_limit: 1500m
    memswap_limit: 1500m
    volumes:
      - hf_cache_worker:/srv/.hf
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy, required: false }
      qdrant: { condition: service_started }
      minio: { condition: service_started, required: false }
      rag_migrate_alembic: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # первая загрузка embedding-модели с HF может занять минуты — не считать unhealthy
      start_period: 300s

  rag_api:
    profiles: ["ai", "micro"]
    build: ./services/rag
    command: ["rag-api"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_TOKEN: ${RAG_API_TOKEN:-change-me-rag}
      JWT_SECRET: ${RAG_JWT_SECRET:-${APP_SECRET_KEY}}
      SERVICE_USER_ID: auto_bot
      ASK_TIMEOUT_SEC: "150"
      PORT: "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8100:8100"
    depends_on:
      rabbitmq: { condition: service_healthy, required: false }
      rag_worker: { condition: service_healthy }
    restart: unless-stopped

  # rag_migrate / rag_migrate_alembic — one-shot джобы (restart: "no"),
  # healthcheck не применим: контейнер завершается с кодом 0 по дизайну.

  # ---------- Перевод тайтлов (PLAN.md, фаза 5; services/translate) ----------
  # Optional-сервис: бэкенд включается TRANSLATE_ENABLED=true; упал →
  # UI показывает оригинальные тайтлы (fallback обязателен).
  # NLLB на CPU при постоянных батчах накапливает RSS (кэши слоёв) — поэтому
  # тройная защита: чанкинг + gc в коде, RSS-сторож (самовыход → рестарт),
  # жёсткий mem_limit (иначе OOM-killer может убить соседние контейнеры).
  translate:
    profiles: ["workers", "mono", "micro"]
    build: ./services/translate
    command: ["translate-api"]
    environment:
      API_TOKEN: ${TRANSLATE_API_TOKEN:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-facebook/nllb-200-distilled-600M}
      # xet-протокол HF зависал на 0 байт (медленный канал) — обычный HTTP
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      # Порог должен быть ВЫШЕ легитимного пика модель+инференс (~2.9ГБ на
      # батче 32), иначе сторож зациклит рестарты (было 30 рестартов/3ч):
      # ловим только реальную утечку сверх пика.
      TRANSLATE_MAX_RSS_MB: "2950"
    mem_limit: 3500m
    memswap_limit: 3500m
    volumes:
      # Кэш весов NLLB (~2.4ГБ): без volume каждая загрузка после рестарта
      # (в т.ч. по RSS-сторожу) перекачивала модель с HF заново
      - hf_cache:/srv/.hf
    ports:
      - "8200:8200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # прогрев NLLB (~30с) + первая загрузка весов из HF — не считать unhealthy
      start_period: 300s

  # Публичный туннель к миниаппу для Telegram — поднимается НЕ здесь, а
  # скриптом miniapp-url.bat (ssh -R к localhost.run) на хосте: контейнерный
  # cloudflared не работает — trycloudflare.com блокируется сетью провайдера
  # (EOF на api.trycloudflare.com). Для постоянного домена см. miniapp-url.bat,
  # раздел про аккаунт localhost.run / именованный Cloudflare Tunnel.


volumes:
  qdrant_storage:
  minio_data:
  pg_data:
  redis_data:
  rabbitmq_data:
  hf_cache_worker:
  hf_cache:
