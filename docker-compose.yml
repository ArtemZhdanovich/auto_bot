# Dev/staging окружение (ТЗ п. 11.2).
#
# Два режима развёртывания (docker compose profiles):
#   --profile mono   — монолит: backend со всеми роутерами на :8000;
#   --profile micro  — микросервисы: gateway (:8010, хост) + 6 доменных
#                      сервисов (:8101–8106); gateway получает сетевой
#                      алиас `backend`, поэтому бот и Mini App не меняются.
# Инфраструктура (postgres/redis/rabbitmq/qdrant/minio/rag/translate)
# общая для обоих режимов. Бот, воркеры и Mini App стартуют в любом
# из профилей: --profile mono или --profile micro.
# Примеры:
#   docker compose --profile mono up -d
#   docker compose --profile micro up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autoselect
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    profiles: ["mono"]
    environment:
      # .env может держать localhost (запуск по процессам) — в compose хост другой
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s

  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    profiles: ["mono", "micro"]
    environment:
      # Внутри compose бот ходит в backend по имени сервиса
      # (в профиле micro это alias gateway'а)
      APP_BASE_URL: http://backend:8000
      # FSM-хранилище бота — Redis; .env может держать localhost (запуск по процессам)
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker_fetch:
    build: .
    command: python -m app.workers.fetch
    env_file: .env
    profiles: ["mono", "micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker_send:
    build: .
    command: python -m app.workers.send
    env_file: .env
    profiles: ["mono", "micro"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/autoselect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  miniapp:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["mono", "micro"]
    ports:
      - "8080:80"
    depends_on:
      backend: { condition: service_healthy }

  # ---------- Микросервисы (профиль micro; docker compose --profile micro up) ----------

  # Единая точка входа /api/*; алиас backend — бот и nginx Mini App
  # ходят в него без изменения конфигурации.
  gateway:
    build: .
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    profiles: ["micro"]
    environment:
      SVC_IDENTITY_URL: http://identity:8101
      SVC_CATALOG_URL: http://catalog:8102
      SVC_BILLING_URL: http://billing:8103
      SVC_PARTNERS_URL: http://partners:8104
      SVC_DIALOG_URL: http://dialog:8105
      SVC_ADMIN_URL: http://admin:8106
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8010:8000"
    networks:
      default:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s

  identity:
    build: .
    command: uvicorn services.identity.main:app --host 0.0.0.0 --port 8101
    env_file: .env
    profiles: ["micro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s

  catalog:
    build: .
    command: uvicorn services.catalog.main:app --host 0.0.0.0 --port 8102
    env_file: .env
    profiles: ["micro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s

  billing:
    build: .
    command: uvicorn services.billing.main:app --host 0.0.0.0 --port 8103
    env_file: .env
    profiles: ["micro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s

  partners:
    build: .
    command: uvicorn services.partners.main:app --host 0.0.0.0 --port 8104
    env_file: .env
    profiles: ["micro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8104:8104"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s

  dialog:
    build: .
    command: uvicorn services.dialog.main:app --host 0.0.0.0 --port 8105
    env_file: .env
    profiles: ["micro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }   # финализация ставит fetch-задачи
    ports:
      - "8105:8105"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105/health"]
      interval: 30s

  admin:
    build: .
    command: uvicorn services.admin.main:app --host 0.0.0.0 --port 8106
    env_file: .env
    profiles: ["micro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }   # ручной fetch ставит задачу
    ports:
      - "8106:8106"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8106/health"]
      interval: 30s


  # ---------- RAG-микросервис (ядро из rag_service) ----------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # One-shot: БД rag в общем postgres + миграции alembic
  rag_migrate:
    image: postgres:16
    environment:
      PGPASSWORD: ${DB_PASSWORD:-app}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -U app -d autoselect -tc "SELECT 1 FROM pg_database WHERE datname='rag'" | grep -q 1 ||           psql -h postgres -U app -d autoselect -c 'CREATE DATABASE rag'
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  rag_migrate_alembic:
    build: ./services/rag
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/rag
    depends_on:
      rag_migrate: { condition: service_completed_successfully }
    restart: "no"

  rag_worker:
    build: ./services/rag
    command: ["rag-worker"]
    environment: &rag_env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QDRANT_HOST: qdrant
      POSTGRES_DSN: postgresql+asyncpg://app:${DB_PASSWORD:-app}@postgres:5432/rag
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: ${RAG_JWT_SECRET:-${APP_SECRET_KEY}}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-glm}
      LLM_MODEL: ${RAG_LLM_MODEL:-glm-4.6}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://api.z.ai/api/paas/v4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ENCRYPT_DOCUMENTS: ${ENCRYPT_DOCUMENTS:-false}
      PQ_ENCRYPTION_PUBLIC_KEY: ${PQ_ENCRYPTION_PUBLIC_KEY:-}
      PQ_ENCRYPTION_PRIVATE_KEY: ${PQ_ENCRYPTION_PRIVATE_KEY:-}
      REDIS_URL: redis://redis:6379/1
      METRICS_PORT: "8101"
      WORKER_QUEUES: "all"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio: { condition: service_started }
      rag_migrate_alembic: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5

  rag_api:
    build: ./services/rag
    command: ["rag-api"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_TOKEN: ${RAG_API_TOKEN:-change-me-rag}
      JWT_SECRET: ${RAG_JWT_SECRET:-${APP_SECRET_KEY}}
      SERVICE_USER_ID: auto_bot
      ASK_TIMEOUT_SEC: "30"
      PORT: "8100"
    ports:
      - "8100:8100"
    depends_on:
      rabbitmq: { condition: service_healthy }
      rag_worker: { condition: service_healthy }
    restart: unless-stopped

  # ---------- Перевод тайтлов (PLAN.md, фаза 5; services/translate) ----------
  # Optional-сервис: бэкенд включается TRANSLATE_ENABLED=true; упал →
  # UI показывает оригинальные тайтлы (fallback обязателен).
  translate:
    build: ./services/translate
    command: ["translate-api"]
    environment:
      API_TOKEN: ${TRANSLATE_API_TOKEN:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-facebook/nllb-200-distilled-600M}
    ports:
      - "8200:8200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout: 10s
      retries: 5


volumes:
  qdrant_storage:
  minio_data:
  pg_data:
  redis_data:
  rabbitmq_data:
